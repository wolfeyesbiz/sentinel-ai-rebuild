services:
  - type: web
    name: sentinel-ai-rebuild
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ANOMALY_THRESHOLD
        value: "0.70"
      - key: AUTO_BLOCK_CRITICAL
        value: "true"
      - key: DB_PATH
        value: /tmp/sentinel.db
      - key: PYTHONUNBUFFERED
        value: "1"
